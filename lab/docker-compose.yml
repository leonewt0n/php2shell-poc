# Lab: WordPress + Drupal + Joomla (PHP 8.4.26 mod_php)
#
# docker-compose up -d
#
# :9080 WordPress, :9081 Drupal, :9082 Joomla
# :9083 Bug3 (--profile bug3), :9084 Bug4 (--profile bug4)
#
# Surum kontrolu: docker compose exec wordpress php -r 'echo PHP_VERSION;'

services:
  # ── Database ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── WordPress (PHP 8.4.26 mod_php) ───────────────────────
  wordpress:
    image: wordpress:6.7-php8.4-apache
    ports:
      - "9080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./proof:/out
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Drupal (PHP 8.4 mod_php) ─────────────────────────────
  drupal:
    image: drupal:php8.4-apache
    ports:
      - "9081:80"
    volumes:
      - drupal_data:/var/www/html
      - ./proof:/out
    restart: unless-stopped

  # ── Joomla (PHP 8.4 mod_php) ─────────────────────────────
  joomla:
    image: joomla:5-php8.4-apache
    ports:
      - "9082:80"
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: root
      JOOMLA_DB_PASSWORD: root
      JOOMLA_DB_NAME: joomla
    volumes:
      - joomla_data:/var/www/html
      - ./proof:/out
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Bug 3 (PHP 8.5.11 backtrace UAF; profil ile) ─────────
  bug3:
    build:
      context: ..
      dockerfile: lab/Dockerfile.bug3
    image: php2shell-bug3:8.5.11
    profiles: ["bug3"]
    ports:
      - "9083:80"
    restart: "no"

  # ── Bug 4 (OPcache confusion; profil ile) ────────────────
  bug4:
    build:
      context: ..
      dockerfile: lab/Dockerfile.bug4
    image: php2shell-bug4:8.4.26
    profiles: ["bug4"]
    ports:
      - "9084:80"
    restart: "no"

volumes:
  db_data:
  wp_data:
  drupal_data:
  joomla_data:
